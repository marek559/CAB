    <g><rect x="440" y="620" width="320" height="76" rx="18" fill="#101F2C" stroke="#2B5065"/><text x="470" y="650" fill="#9FE870" font-size="16">05</text><text x="510" y="652" fill="#F4F1E9" font-size="22" font-weight="700">Procesy produkcyjne</text><text x="510" y="678" fill="#B9C5CF" font-size="14">parametry · jakość · linie technologiczne</text></g>
