<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mapa obszarów technologicznych CAB</title>
  <desc id="desc">CAB łączy energię i OZE, stomatologię cyfrową, materiały, konstrukcje i procesy.</desc>
  <rect width="1200" height="720" fill="#091826"/>
  <g stroke="#213749" stroke-width="1" opacity="0.55">
    <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M0 600H1200"/>
    <path d="M120 0V720M240 0V720M360 0V720M480 0V720M600 0V720M720 0V720M840 0V720M960 0V720M1080 0V720"/>
  </g>
  <g fill="none" stroke="#77C8E8" stroke-width="2" opacity="0.7">
