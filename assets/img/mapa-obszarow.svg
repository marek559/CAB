    <g><rect x="90" y="100" width="320" height="140" rx="18" fill="#101F2C" stroke="#2B5065"/><text x="120" y="150" fill="#9FE870" font-size="16">01</text><text x="120" y="185" fill="#F4F1E9" font-size="24" font-weight="700">Energia i OZE</text><text x="120" y="215" fill="#B9C5CF" font-size="15">zarządzanie · integracja · efektywność</text></g>
    <g><rect x="790" y="100" width="320" height="140" rx="18" fill="#101F2C" stroke="#2B5065"/><text x="820" y="150" fill="#9FE870" font-size="16">02</text><text x="820" y="185" fill="#F4F1E9" font-size="24" font-weight="700">Stomatologia cyfrowa</text><text x="820" y="215" fill="#B9C5CF" font-size="15">DSD · protetyka · walidacja</text></g>
    <g><rect x="50" y="470" width="320" height="140" rx="18" fill="#101F2C" stroke="#2B5065"/><text x="80" y="520" fill="#9FE870" font-size="16">03</text><text x="80" y="555" fill="#F4F1E9" font-size="24" font-weight="700">Nowoczesne materiały</text><text x="80" y="585" fill="#B9C5CF" font-size="15">dobór · badania · właściwości</text></g>
